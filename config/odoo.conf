[options]
addons_path = /opt/custom-addons
data_dir = /var/lib/odoo
db_host = db
db_port = 5432
db_user = odoo
db_name = odoo
dbfilter = ^odoo$
db_maxconn = 8
list_db = False
proxy_mode = True
http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072
workers = 2
max_cron_threads = 1
limit_memory_soft = 536870912
limit_memory_hard = 671088640
limit_time_cpu = 60
limit_time_real = 120
limit_request = 8192
log_level = info
log_handler = :INFO,werkzeug:WARNING
